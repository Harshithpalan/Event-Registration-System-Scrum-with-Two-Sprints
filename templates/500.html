{% extends 'base.html' %}

{% block title %}Server Error (500) - EventHub{% endblock %}

{% block content %}
<div class="container">
  <div class="empty-state" style="margin-top: 4rem;">
    <div class="empty-icon" style="font-size: 4rem; color: var(--danger);">⚠️</div>
    <h1 style="font-size: 3rem; margin-bottom: 0.5rem;">500</h1>
    <h2 class="empty-title">Internal Server Error</h2>
    <p class="empty-desc">
      An unexpected error occurred while processing your request. Please return to the homepage or try again.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
      &larr; Back to Events Catalog
    </a>
  </div>
</div>
{% endblock %}
